<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIMUS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="../resources/SMALL_logo.png" type="image/x-icon">
</head>
<body>
    <header id="header">

    </header>

    <main>
        <div class="log-forms-container">
        <button id="log-switch"> <span>Log-in</span> | <span>Register</span></button><br><br>

        <form id="loginForm" class="form">
            <div class="log-item">
                <label class for="tag">@tag</label>
                <input type="text" id="tag" name="tag" required>
            </div>
            
            <div class="log-item">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="log-item login">
                <button type="submit">Login</button>
            </div>
            
        </form>

        <form id="regForm" class="form">
            <div class="log-item">
                <label class for="name">Full name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="log-item">
                <label class for="name">Display name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="log-item">
                <label class for="name">@tag</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="log-item">
                <label class for="name">Email</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="log-item">
                <label class for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="log-item">
                <label class for="password">Confirm password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="log-item">
                <label class for="name">School</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="log-item">
                <label class for="name">Stage of study</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="log-item">
                <label class for="name">Subjects studied</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="log-item">
                <label class for="name">Exam boards</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="log-item">
                <label class for="name">Country</label>
                <input type="text" id="name" name="name" required>
            </div>

            
            <div class="log-item login">
                <button type="submit">Register</button>
            </div>
        </form>
    </div>
    </main>

    <script src="headerinsert.js"></script>
    <script src="header.js"></script>
    <script src="login.js"></script>
</body>
</html>
