<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIMUS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="../resources/SMALL_logo.png" type="image/x-icon">
</head>
<body>
    <header id="header">

    </header>

    <main>
        <div class="log-forms-container">
        <button id="log-switch"> <span>Log-in</span> | <span>Register</span></button><br><br>

        <form id="loginForm">
            <div class="log-item">
                <label class for="username">Username</label><br>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="log-item">
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="log-item">
                <button type="submit">Login</button>
            </div>
            
        </form>

        <form id="regForm">
            <div class="log-item">
                <label class for="username">YO</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="log-item">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="log-item">
                <button type="submit">Login</button>
            </div>
        </form>
    </div>
    </main>

    <script src="headerinsert.js"></script>
    <script src="header.js"></script>
    <script src="login.js"></script>
</body>
</html>
