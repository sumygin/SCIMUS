<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIMUS</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="resources/SMALL_logo.png" type="image/x-icon">
</head>
<body>
    <header id="header">

    </header>

    <main>
        <button id="log-switch"> <span>Log-in</span> | <span>Register</span></button><br><br>

        <form id="loginForm" class="form" action="/login" method="post">
            <div class="log-forms-container">
                <div class="log-item">
                    <label class for="tag">User tag</label>
                    <input type="text" id="tag" name="tag" required class="log-item-field">
                </div>
               
                <div class="log-item">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required class="log-item-field">
                </div>
                
                <div class="login">
                    <button type="submit">Login</button>
                </div>
            </div>
        </div>

            
        </form>

        <form id="regForm" class="form" action="/register" method="post">
            <div class="log-forms-container">
            <div class="log-item">
                <label class for="name">Full name</label>
                <input type="text" id="name" name="name"  autocomplete="name" required class="log-item-field">
            </div>
            
            <div class="log-item">
                <label for="username">Display name</label>
                <input type="text" id="username" name="username" required  autocomplete="username" class="log-item-field">
            </div>
            <div class="log-item">
                <label for="tag">User tag</label>
                <input type="text" id="tag" name="tag" required class="log-item-field">
            </div>
            <div class="log-item">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" required  autocomplete="email" class="log-item-field">
            </div>
            <div class="log-item">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required class="log-item-field">
            </div>
            <div class="log-item">
                <label for="password_1">Confirm password</label>
                <input type="password_1" id="password_1" name="password_1" required  class="log-item-field">
            </div>
            <div class="log-item">
                <label for="name">School</label>
                <div class="autocomplete-input school">
                    <input type="text" id="school" name="school" class="log-item-field">
                    <div class="space">
                    </div>
                </div>
            </div>
            <div class="log-item">
                <label for="name">Country</label>
                <div class="autocomplete-input country">
                    <input type="text" id="country" name="country" class="log-item-field">
                    <div class="space">
                    </div>
                </div>
            </div>
            <div class="log-item">
                <label for="stage">Stage of study</label>
                <select id="stage" name="stage"class="log-item-field">
                    <option value="0">GCSE</option>
                    <option value="1">A-level</option>
                    <option value="2">University+</option>
                </select>
            </div>
            <div class="log-item">
                <label for="subjects">Subjects studied</label>
                <input type="text" id="subjects" name="subjects"class="log-item-field">
            </div>
            

            
            <div class="login">
                <button type="submit">Register</button>
            </div>

        </form>

    </div>
    </main>

    <script src="js/headerinsert.js"></script>
    <script src="js/header.js"></script>
    <script src="js/login.js"></script>
    <script src="js/autocomplete.js"></script>
</body>
</html>
