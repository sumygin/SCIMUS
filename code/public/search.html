<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - SCIMUS</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="shortcut icon" href="resources/SMALL_logo.png" type="image/x-icon">
</head>
<body>
    <header id="header">

    </header>

    <main>
        <button id="qc-switch"> <span>Questions</span> | <span>Collections</span></button><br><br>
        <div class="searchwrapper">
        <div id="questionSearch" >
            <form class="searchbar" id="questionForm" method="post">

                <select name="stage" id="stage" class="searchbar-item">
                    <option value="-1" style="display: none;" selected>study stage</option>
                    <option value="0">GCSE</option> 
                    <option value="1">A-level</option>
                    <option value="2">University+</option>
                </select>

                <div class="autocomplete-input subject">
                    <input type="text" id="subject" name="subject" placeholder="subject" class="searchbar-item">
                    <div class="space">
                    </div>
                </div>

                <select name="paper" id="paper" class="searchbar-item">
                    <option value="-1" style="display: none;" selected>paper number</option>
                </select>

                <input type="text" placeholder="year" name="year" id="year" class="searchbar-item">

                <select name="tag" id="tag" class="searchbar-item">
                    <option value="-1" style="display: none;" selected>question type</option>
                    <option value="0">Past paper</option> 
                    <option value="1">User-made</option>
                    <option value="2">Looking for solution</option>
                </select>

                <input type="text" placeholder="@creator" name="creator" id="creator" class="searchbar-item">
                
                <div class="autocomplete-input topic">
                    <input type="text" id="topic" name="topic" placeholder="topic" class="searchbar-item">
                    <div class="space">
                    </div>
                </div>

                <input type="text" placeholder="contains" name="search" id="search" class="searchbar-item">
                
                <select name="sort" id="sort" class="searchbar-item">
                    <option value="views">Views</option>
                    <option value="easy">Easiest</option>
                    <option value="hard">Hardest</option>
                    <option value="likes">Like rating</option>
                    <option value="commments">Number of comments</option>
                    <option value="rates">Number of ratings</option>
                    <option value="num">Question number</option>
                    <option value="time">Recent</option>
                </select>

                <input type="submit" id="qSubmit" value="Search" class="searchbar-item">

                <input type="text" style="display:none;" id="page" value="1">
            </form>
        </div>

        <div id="collectionSearch">
            <form class="searchbar" id="collectionForm">
                <input type="text" placeholder="search" name="search" id="search1" class="searchbar-item">
                
                <input type="text" placeholder="subject" name="subject" id="subject1"class="searchbar-item">

                <select name="stage" id="stage1" class="searchbar-item">
                    <option value="0">GCSE</option> 
                    <option value="1">A-level</option>
                    <option value="2">University+</option>
                </select>
                <select name="paper" id="paper1" class="searchbar-item">
                    <option value="">Paper 1</option> 
                    <option value="">Paper 2</option>
                    <option value="">Paper 3</option>
                </select>
                <input type="text" placeholder="year" name="year" id="year1" class="searchbar-item">
                <select name="tag" id="tag1" class="searchbar-item">
                    <option value="">Past paper</option> 
                    <option value="">User-made</option>
                </select>
                <input type="text" placeholder="@creator" name="creator" id="creator1" class="searchbar-item">
                <select name="topic" id="topic1" class="searchbar-item">
                    <option value="">topicplaceholderlongname1</option> 
                    <option value="">placeholder1</option>
                    <option value="">placeholder1</option>
                </select>
            </form>
        </div>
    </div>

    <div class="displayWrapperCenter">
        <div class="displaywrapper">

            <div id="displaySpace">
                
            </div>

            
        </div>
    </div>
    
        <div class="error"></div>
    </main>

    <script src="/js/headerinsert.js" type="module"></script>
    <script src="/js/header.js" type="module"></script>
    <script src="/js/search.js" type="module"></script>
    <script type="module" src="/js/autocomplete.js"></script>
</body>
</html>
