<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - SCIMUS</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/search.css">
    <link rel="icon" href="/resources/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/resources/apple-touch-icon.png">
    <link rel="stylesheet" href="/vendor/katex/katex.min.css">
    <script defer src="/vendor/katex/katex.min.js"></script>
    <script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
</head>
<body>
    <header id="header">

    </header>

    <main>
        <button id="qc-switch" type="button"> <span>Questions</span> | <span>Collections</span></button><br><br>
        <div class="searchwrapper">
        <div id="questionSearch" >
            <form class="searchbar" id="questionForm" method="GET">

                <select name="stage" id="stage" class="stageFIELD searchbar-item">
                    <option value="-1" style="display: none;" selected>study stage</option>
                    <option value="0">GCSE</option> 
                    <option value="1">A-level</option>
                    <option value="2">University+</option>
                </select>

                <div class="autocomplete-input subject">
                    <input type="text" id="subject" name="subject" placeholder="subject" class="subjectFIELD searchbar-item">
                    <div class="space">
                    </div>
                </div>

                <select name="paper" id="paper" class="paperFIELD searchbar-item">
                    <option value="-1" style="display: none;" selected>paper number</option>
                </select>

                <input type="text" inputmode="numeric" maxlength="4" placeholder="year" name="year" id="year" class="searchbar-item">

                <select name="tag" id="tag" class="searchbar-item">
                    <option value="-1" style="display: none;" selected>question type</option>
                    <option value="0">Past paper</option> 
                    <option value="1">User-made</option>
                    <option value="2">Looking for solution</option>
                </select>

                <input type="text" placeholder="@creator" name="creator" id="creator" class="searchbar-item">
                
                <div class="autocomplete-input topic">
                    <input type="text" id="topic" name="topic" placeholder="topic" class="topicFIELD searchbar-item">
                    <div class="space">
                    </div>
                </div>

                <input type="text" placeholder="contains" name="search" id="search" class="searchbar-item">
                
                <select name="sort" id="sort" class="searchbar-item">
                    <option value="views">Views</option>
                    <option value="easy">Easiest</option>
                    <option value="hard">Hardest</option>
                    <option value="likes">Like rating</option>
                    <option value="comments">Number of comments</option>
                    <option value="rates">Number of ratings</option>
                    <option value="num">Question number</option>
                    <option value="time">Recent</option>
                </select>

                <input type="submit" id="qSubmit" value="Search" class="searchbar-item">

                <input type="hidden" id="page" value="1" name="page">
                <input type="hidden" id="searchType" value="q" name="searchType">
            </form>
        </div>

        <div id="collectionSearch">
            <form class="searchbar" id="collectionForm" method="GET">

                <select name="stage" id="stage1" class="stageFIELD searchbar-item">
                    <option value="-1" style="display: none;" selected>study stage</option>
                    <option value="0">GCSE</option> 
                    <option value="1">A-level</option>
                    <option value="2">University+</option>
                </select>

                <div class="autocomplete-input subject">
                    <input type="text" id="subject1" name="subject" placeholder="subject" class="subjectFIELD searchbar-item">
                    <div class="space">
                    </div>
                </div>

                <select name="paper" id="paper1" class="paperFIELD searchbar-item">
                    <option value="-1" style="display: none;" selected>paper number</option>
                </select>

                <input type="text" inputmode="numeric" maxlength="4" placeholder="year" name="year" id="year1" class="searchbar-item">

                <select name="tag" id="tag1" class="searchbar-item">
                    <option value="-1" style="display: none;" selected>collection type</option>
                    <option value="0">Past paper</option> 
                    <option value="1">User-made</option>
                </select>

                <input type="text" placeholder="@creator" name="creator" id="creator1" class="searchbar-item">
                
                <div class="autocomplete-input topic">
                    <input type="text" id="topic1" name="topic" placeholder="topic" class="topicFIELD searchbar-item">
                    <div class="space">
                    </div>
                </div>

                <input type="text" placeholder="contains" name="search" id="search1" class="searchbar-item">
                
                <select name="sort" id="sort1" class="searchbar-item">
                    <option value="time">Recent</option>
                    <option value="num">Number of questions</option>
                    
                </select>

                <input type="submit" id="cSubmit" value="Search" class="searchbar-item">

                <input type="hidden" id="page1" value="1" name="page">
                <input type="hidden" id="searchType1" value="q" name="searchType">
            </form>
        </div>
    </div>

    <div class="displayWrapperCenter">
        <div class="displaywrapper">

            <div id="QdisplaySpace">
                
            </div>

            <div id="CdisplaySpace">
                
            </div>

            
        </div>
    </div>
    
        <div class="error"></div>
    </main>

    <script src="/js/headerinsert.js"></script>
    <script type="module" src="/js/header.js"></script>
    <script src="/js/searchlaunch.js" type="module"></script>
</body>
</html>
