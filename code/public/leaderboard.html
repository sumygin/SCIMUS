<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIMUS</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/leaderboard.css">
    <link rel="shortcut icon" href="resources/SMALL_logo.png" type="image/x-icon">
</head>
<body>
    <header id="header">

    </header>

    <main>
        <div class="titlecontainer">
            <h3>LEADERBOARD</h3>
        </div>

        <div id="leaderboardSearch" >
            <form class="searchbar">
                <select name="sort" id="sort" class="searchbar-item">
                    <option value="">Time studied</option> 
                    <option value="">Questions created</option>
                    <option value="">Questions completed</option>
                    <option value="">Average question rating</option>
                </select>
                <select name="time" id="time" class="searchbar-item">
                    <option value="">All time</option> 
                    <option value="">Today</option>
                </select>
                <input type="text" placeholder="school" name="school" id="school" class="searchbar-item">
                <input type="text" placeholder="country" name="country" id="country" class="searchbar-item">
            </form>
        </div>

        <div class="displaywrapper">
            <div id="displaySpace">
                <div class="lb-item" id="headers">
                    <div class="lb-info rank">Rank</div>
                    <a href="/profile">
                        <div class="lb-info tag">Tag</div>
                    </a>
                    <div class="lb-info filter">Time studied</div>
                    <div class="lb-info school">School</div>
                    <div class="lb-info country">Country</div>
                </div>
            </div>
                
        </div>
    </main>

    <script src="js/headerinsert.js"></script>
    <script src="js/header.js"></script>
</body>
</html>
