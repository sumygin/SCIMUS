<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Leaderboards - SCIMUS</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/leaderboard.css">
    <link rel="icon" href="/resources/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/resources/apple-touch-icon.png">
</head>
<body>
    <header id="header">

    </header>

    <main>
        <div class="titlecontainer">
            <h3>LEADERBOARDS</h3>
        </div>

        <div id="leaderboardSearch">
            <form class="searchbar" id="lForm"  method="GET">
                <select name="sort" id="sort" class="searchbar-item" >
                    <option value="time">Time studied</option> 
                    <option value="qcreate">Questions created</option>
                    <option value="qcomplete">Questions completed</option>
                    <option value="likes">Like rating</option>
                </select>
                <select name="time" id="time" class="searchbar-item">
                    <option value="0">All time</option> 
                    <option value="1">Today</option>
                </select>
                <div class="autocomplete-input school searchbar-item">
                    <input type="text" placeholder="school" name="school" id="school">
                    <div class="space">
                    </div>
                </div>
                
                <div class="autocomplete-input country searchbar-item">
                    <input type="text" placeholder="country" name="country" id="country">
                    <div class="space">
                    </div>
                </div>

                <input type="hidden" id="page" value="1" name="page">

                <input type="submit" id="submit" value="Search" class="searchbar-item">

            </form>
        </div>

        <div class="displaywrapper">
            <div id="displaySpace">
                
            </div>
                
        </div>
        
        <div class="error"></div>
    </main>

    <script src="/js/headerinsert.js"></script>
    <script type="module" src="/js/header.js"></script>
    <script type="module" src="/js/autocomplete.js"></script>
    <script type="module" src="/js/leaderboard.js"></script>
</body>
</html>
