<!DOCTYPE html>
<html lang="en" data-hold>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create - SCIMUS</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/question.css">
    <link rel="stylesheet" href="/css/create.css">
    <link rel="icon" href="/resources/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/resources/apple-touch-icon.png">
</head>
<body>
    <header id="header">

    </header>

    <main>
        <form class="pagecontainer" id="qform" method="post">
            <div class="metadata">

                <div class="meta-item">
                    <label for="stage">Study stage</label>
                    <select name="stage" id="stage" required class="stageFIELD">
                        <option value="-1" style="display: none;" selected>-</option>
                        <option value="0">GCSE</option>
                        <option value="1">A-level</option>
                        <option value="2">University+</option>
                    </select>
                </div>

                <div class="meta-item">
                    <label for="subject">Subject</label>
                    <div class="autocomplete-input subject">
                        <input type="text" id="subject" name="subject" required class="subjectFIELD">
                        <div class="space">
                        </div>
                    </div>
                </div>

                <div class="meta-item">
                    <label for="topic">Topic</label>
                    <div class="autocomplete-input topic">
                        <input type="text" id="topic" name="topic" required class="topicFIELD">
                        <div class="space">
                        </div>
                    </div>
                </div>

                <div class="meta-item">
                    <label for="tag">Type</label>
                    <select name="tag" id="tag" required>
                        <option value="-1" style="display: none;" selected>-</option>
                        <option value="user">User-made</option>
                        <option value="solution">Looking for solution</option>
                    </select>
                </div>
            </div>

            <div class="content">
                <div class="titles">
                    <input required type="text" class="title" autocapitalize="words" placeholder="Question name" id="qname" name="qname" maxlength="40" autocomplete="off">
                </div>
                <div class="question">
                    <div class="question-text">
                        <textarea required maxlength="5000" placeholder="Enter question here. Surround equations with $$equation$$ for block and $equation$ for inline." id="qtext" name="qtext"></textarea>
                    </div>  
                </div>
                <div class="question">
                    <div class="question-text">
                        <textarea required maxlength="5000" placeholder="Enter mark scheme here..." id="mstext" class="ms-text" name="mstext"></textarea>
                    </div>                   
                </div>
                
                <div class="bottom-bar">
                    <input type="submit" value="Save" id="save">
                    <div class="mark-scheme" id="flip">
                    </div>
                    <input type="submit" value="Publish" id="pub">
                </div>
            </div>
            <div class="actions">
            </div>
        </form>

        <div class="error"></div>
    </main>

    <script src="/js/headerinsert.js"></script>
    <script type="module" src="/js/header.js"></script>
    <script type="module" src="/js/createlaunch.js"></script>
</body>
</html>
